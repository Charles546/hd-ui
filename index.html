<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <title>Honeydipper UI</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: system-ui, sans-serif; background: #0f1117; color: #e2e8f0; min-height: 100vh; }
      .md-content { font-size: 13px; color: #cbd5e1; line-height: 1.6; }
      .md-content p { margin-bottom: 8px; }
      .md-content p:last-child { margin-bottom: 0; }
      .md-content h1,.md-content h2,.md-content h3,.md-content h4,.md-content h5,.md-content h6 { color: #e2e8f0; font-weight: 600; margin: 12px 0 6px; line-height: 1.3; }
      .md-content h1 { font-size: 18px; } .md-content h2 { font-size: 16px; } .md-content h3 { font-size: 14px; }
      .md-content code { font-family: monospace; font-size: 12px; background: #1e2540; color: #93c5fd; padding: 1px 5px; border-radius: 4px; }
      .md-content pre { background: #1e2540; border-radius: 6px; padding: 10px 12px; overflow-x: auto; margin: 8px 0; }
      .md-content pre code { background: none; padding: 0; color: #93c5fd; font-size: 12px; }
      .md-content ul,.md-content ol { padding-left: 20px; margin-bottom: 8px; }
      .md-content li { margin-bottom: 3px; }
      .md-content a { color: #38bdf8; text-decoration: underline; }
      .md-content blockquote { border-left: 3px solid #4d5880; padding-left: 10px; color: #94a3b8; margin: 8px 0; font-style: italic; }
      .md-content strong { color: #e2e8f0; font-weight: 600; }
      .md-content em { color: #94a3b8; }
      .md-content table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 12px; }
      .md-content th,.md-content td { border: 1px solid #2d3148; padding: 4px 8px; text-align: left; }
      .md-content th { background: #1e2438; color: #e2e8f0; }
      .md-content hr { border: none; border-top: 1px solid #2d3148; margin: 10px 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="/config.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
